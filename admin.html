
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GovGuide | Admin</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; background: #f3f7fc; color: #17345c; }
    header { background: #103b76; color: white; padding: 20px 7%; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
    header h1 { margin: 0; }
    nav a { color: white; text-decoration: none; margin-right: 16px; }
    main { max-width: 900px; margin: 35px auto; padding: 0 18px; }
    .panel { background: white; padding: 25px; border-radius: 14px; border: 1px solid #e0e8f2; box-shadow: 0 5px 18px #17345c0c; }
    .intro { color: #536985; line-height: 1.5; }
    form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    label { font-weight: bold; font-size: 14px; }
    input, select, textarea { display: block; width: 100%; margin-top: 7px; padding: 12px; border: 1px solid #cbd7e6; border-radius: 8px; font: inherit; background: white; }
    textarea { resize: vertical; min-height: 100px; }
    button { padding: 13px 18px; border: 0; border-radius: 8px; background: #1769d2; color: white; font: inherit; cursor: pointer; }
    button:disabled { opacity: 0.6; cursor: wait; }
    .full { grid-column: 1 / -1; }
    #message { line-height: 1.5; overflow-wrap: anywhere; }
    .categories { border: 1px solid #cbd7e6; padding: 12px; border-radius: 8px; margin-top: 7px; }
    .categories label { display: inline-flex; align-items: center; gap: 6px; margin: 7px 12px 7px 0; font-weight: normal; }
    .categories input { width: auto; margin: 0; }
    .hidden { display: none; }
    @media (max-width: 600px) { form { grid-template-columns: 1fr; } .full { grid-column: auto; } }
  </style>
</head>
<body>
  <header>
    <h1>GovGuide Admin</h1>
    <nav>
      <a href="./index.html">Home</a>
      <a href="./profile.html">Profile</a>
      <button id="logoutButton" class="hidden" type="button">Log out</button>
    </nav>
  </header>

  <main>
    <section class="panel" id="loginPanel">
      <h2>Administrator Login</h2>
      <p class="intro">Sign in to manage government opportunities.</p>
      <form id="loginForm">
        <label class="full">Username
          <input id="username" name="username" autocomplete="username" required>
        </label>
        <label class="full">Password
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </label>
        <div class="full">
          <button id="loginButton" type="submit">Log in</button>
        </div>
      </form>
      <p id="loginMessage" role="status" aria-live="polite"></p>
    </section>

    <section class="panel hidden" id="adminPanel">
      <h2>Add Government Opportunity</h2>
      <p class="intro">Enter information from the official recruitment, examination or scheme notification.</p>

      <form id="adminForm">
        <label>Opportunity Title
          <input name="title" required maxlength="150" placeholder="e.g. Junior Assistant Recruitment">
        </label>
        <label>Type
          <select name="type" required>
            <option value="">Select type</option>
            <option>Job</option><option>Exam</option><option>Scheme</option><option>Scholarship</option>
          </select>
        </label>
        <label>Organization
          <input name="organization" required maxlength="150" placeholder="Department or organization">
        </label>
        <label>Minimum Qualification
          <select name="qualification" required>
            <option value="">Select qualification</option>
            <option>10th</option><option>Intermediate</option><option>Diploma</option>
            <option>B.Tech</option><option>Degree</option><option>M.Tech</option><option>Post Graduation</option>
          </select>
        </label>
        <label>Branch / Subject
          <input name="branch" placeholder="Any branch">
        </label>
        <label>Minimum Age
          <input name="minAge" type="number" min="0" max="120">
        </label>
        <label>Maximum Age
          <input name="maxAge" type="number" min="0" max="120">
        </label>
        <label>Eligible State
          <select name="state" required>
            <option value="">Select state</option>
            <option>Andhra Pradesh</option><option>Telangana</option><option>Karnataka</option>
            <option>Tamil Nadu</option><option>Other</option>
          </select>
        </label>
        <div class="full">
          <label>Eligible Categories</label>
          <div class="categories">
            <label><input type="checkbox" name="categories" value="General"> General</label>
            <label><input type="checkbox" name="categories" value="OBC"> OBC</label>
            <label><input type="checkbox" name="categories" value="SC"> SC</label>
            <label><input type="checkbox" name="categories" value="ST"> ST</label>
            <label><input type="checkbox" name="categories" value="EWS"> EWS</label>
            <label><input type="checkbox" name="categories" value="Other"> Other</label>
            <label><input type="checkbox" name="categories" value="All"> All eligible categories</label>
          </div>
        </div>
        <label>Application Start Date<input name="startDate" type="date"></label>
        <label>Last Date to Apply<input name="lastDate" type="date" required></label>
        <label>Exam Date<input name="examDate" type="date"></label>
        <label>Allotment / Counselling Date<input name="allotmentDate" type="date"></label>
        <label class="full">Description
          <textarea name="description" required maxlength="3000" placeholder="Explain the opportunity, eligibility and important details"></textarea>
        </label>
        <label class="full">Official Website URL
          <input name="officialLink" type="url" placeholder="https://official-website.gov.in">
        </label>
        <div class="full"><button id="saveButton" type="submit">Save Opportunity</button></div>
      </form>
      <p id="message" role="status" aria-live="polite"></p>
    </section>
  </main>

  <script>
    const API_URL = "https://govguide-1h64.onrender.com";
    const loginPanel = document.getElementById("loginPanel");
    const adminPanel = document.getElementById("adminPanel");
    const loginForm = document.getElementById("loginForm");
    const adminForm = document.getElementById("adminForm");
    const loginMessage = document.getElementById("loginMessage");
    const message = document.getElementById("message");
    const loginButton = document.getElementById("loginButton");
    const saveButton = document.getElementById("saveButton");
    const logoutButton = document.getElementById("logoutButton");

    let adminToken = "";

    function showLogin() {
      adminToken = "";
      loginPanel.classList.remove("hidden");
      adminPanel.classList.add("hidden");
      logoutButton.classList.add("hidden");
    }

    function showAdmin() {
      loginPanel.classList.add("hidden");
      adminPanel.classList.remove("hidden");
      logoutButton.classList.remove("hidden");
    }

    loginForm.addEventListener("submit", async function(event) {
      event.preventDefault();
      loginButton.disabled = true;
      loginMessage.textContent = "Checking login...";

      try {
        const response = await fetch(`${API_URL}/admin/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            username: document.getElementById("username").value.trim(),
            password: document.getElementById("password").value
          })
        });

        const result = await response.json();

        if (!response.ok || !result.token) {
          throw new Error(result.message || "Login failed. Check your username and password.");
        }

        adminToken = result.token;
        loginForm.reset();
        loginMessage.textContent = "";
        showAdmin();
      } catch (error) {
        loginMessage.textContent = error.message || "Could not connect to the server.";
      } finally {
        loginButton.disabled = false;
      }
    });

    logoutButton.addEventListener("click", function() {
      adminForm.reset();
      message.textContent = "";
      showLogin();
    });

    adminForm.addEventListener("submit", async function(event) {
      event.preventDefault();

      const data = Object.fromEntries(new FormData(adminForm).entries());
      data.categories = Array.from(
        adminForm.querySelectorAll('input[name="categories"]:checked')
      ).map(input => input.value);

      if (data.categories.length === 0) {
        message.textContent = "Please select at least one eligible category.";
        return;
      }

      if (data.categories.includes("All") && data.categories.length > 1) {
        message.textContent = 'Select "All eligible categories" alone.';
        return;
      }

      data.category = data.categories[0];
      data.minAge = data.minAge === "" ? null : Number(data.minAge);
      data.maxAge = data.maxAge === "" ? null : Number(data.maxAge);
      data.startDate = data.startDate || null;
      data.examDate = data.examDate || null;
      data.allotmentDate = data.allotmentDate || null;

      if (data.minAge !== null && data.maxAge !== null && data.minAge > data.maxAge) {
        message.textContent = "Minimum age cannot exceed maximum age.";
        return;
      }

      if (data.startDate && data.lastDate && data.startDate > data.lastDate) {
        message.textContent = "Application start date cannot be after the last date.";
        return;
      }

      try {
        saveButton.disabled = true;
        message.textContent = "Saving opportunity...";

        const response = await fetch(`${API_URL}/opportunity`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${adminToken}`
          },
          body: JSON.stringify(data)
        });

        const result = await response.json();

        if (response.status === 401 || response.status === 403) {
          showLogin();
          loginMessage.textContent = "Your login has expired. Please log in again.";
          throw new Error("Please log in again before saving.");
        }

        if (!response.ok) {
          throw new Error(result.message || result.error || "Failed to save opportunity.");
        }

        message.textContent = "Opportunity saved successfully!";
        adminForm.reset();
      } catch (error) {
        message.textContent = error.message || "Could not save opportunity. Please try again.";
      } finally {
        saveButton.disabled = false;
      }
    });

    showLogin();
  </script>
</body>
</html>
