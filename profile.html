
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GovGuide | My Profile</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f7fc;
      color: #17345c;
    }
    header {
      background: #103b76;
      color: white;
      padding: 20px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    header h1 { margin: 0; }
    nav a { color: white; text-decoration: none; margin-right: 16px; }
    main {
      max-width: 850px;
      margin: 35px auto;
      padding: 0 18px;
    }
    .panel {
      background: white;
      padding: 25px;
      border-radius: 14px;
      border: 1px solid #e0e8f2;
      box-shadow: 0 5px 18px #17345c0c;
    }
    h2 { margin-top: 0; }
    .intro { color: #536985; line-height: 1.5; }
    form {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }
    label { display: block; font-weight: bold; font-size: 14px; }
    input, select {
      display: block;
      width: 100%;
      margin-top: 7px;
      padding: 12px;
      border: 1px solid #cbd7e6;
      border-radius: 8px;
      font: inherit;
      background: white;
    }
    button {
      padding: 13px 18px;
      border: 0;
      border-radius: 8px;
      background: #1769d2;
      color: white;
      font: inherit;
      cursor: pointer;
    }
    .full { grid-column: 1 / -1; }
    #message { margin-top: 16px; }
    #results { display: grid; gap: 14px; margin-top: 18px; }
    .card {
      padding: 18px;
      background: #f8fbff;
      border: 1px solid #dce7f5;
      border-radius: 10px;
    }
    .card h3 { margin-top: 0; }
    .card p { line-height: 1.5; color: #536985; }
    .card a { color: #1769d2; font-weight: bold; }
    @media (max-width: 600px) {
      form { grid-template-columns: 1fr; }
      .full { grid-column: auto; }
    }
  </style>
</head>
<body>
  <header>
    <h1>GovGuide</h1>
    <nav>
      <a href="./index.html">Home</a>
      <a href="./profile.html">Profile</a>
      <a href="./admin.html">Admin</a>
    </nav>
  </header>

  <main>
    <section class="panel">
      <h2>My Profile</h2>
      <p class="intro">Enter your details to find opportunities that may fit your qualifications and preferences.</p>

      <form id="profileForm">
        <label>Name
          <input name="name" required maxlength="100" placeholder="Your name">
        </label>

        <label>Age
          <input name="age" type="number" min="1" max="120" required>
        </label>

        <label>Qualification
          <select name="qualification" required>
            <option value="">Select qualification</option>
            <option>10th</option>
            <option>Intermediate</option>
            <option>Diploma</option>
            <option>B.Tech</option>
            <option>Degree</option>
            <option>M.Tech</option>
            <option>Post Graduation</option>
          </select>
        </label>

        <label>Branch / Subject
          <input name="branch" placeholder="e.g. Computer Science">
        </label>

        <label>Percentage
          <input name="percentage" type="number" min="0" max="100" step="0.01" required>
        </label>

        <label>State
          <select name="state" required>
            <option value="">Select state</option>
            <option>Andhra Pradesh</option>
            <option>Telangana</option>
            <option>Karnataka</option>
            <option>Tamil Nadu</option>
            <option>Other</option>
          </select>
        </label>

        <label>Category
          <select name="category" required>
            <option value="">Select category</option>
            <option>General</option>
            <option>OBC</option>
            <option>SC</option>
            <option>ST</option>
            <option>Other</option>
          </select>
        </label>

        <div class="full">
          <button type="submit">Find Matching Opportunities</button>
        </div>
      </form>

      <p id="message" role="status"></p>
    </section>

    <section class="panel" style="margin-top:24px">
      <h2>Potential Matches</h2>
      <p class="intro">Matches will be shown here after the backend is connected.</p>
      <div id="results"></div>
    </section>
  </main>

  <script>
    const form = document.getElementById("profileForm");
    const message = document.getElementById("message");
    const results = document.getElementById("results");

    form.addEventListener("submit", async function(event) {
      event.preventDefault();
      message.textContent = "Your profile form is ready. Backend connection will be configured during deployment.";
      results.replaceChildren();

      const data = Object.fromEntries(new FormData(form).entries());
      const preview = document.createElement("p");
      preview.textContent =
        "Profile entered for " + data.name +
        " — " + data.qualification +
        ", age " + data.age +
        ", " + data.state + ".";
      results.append(preview);
    });
  </script>
</body>
</html>
