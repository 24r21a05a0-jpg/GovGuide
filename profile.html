
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GovGuide | My Profile</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f7fc;
      color: #17345c;
    }

    header {
      background: #103b76;
      color: white;
      padding: 20px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    header h1 {
      margin: 0;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-right: 16px;
    }

    main {
      max-width: 850px;
      margin: 35px auto;
      padding: 0 18px;
    }

    .panel {
      background: white;
      padding: 25px;
      border-radius: 14px;
      border: 1px solid #e0e8f2;
      box-shadow: 0 5px 18px #17345c0c;
      margin-bottom: 24px;
    }

    h2 {
      margin-top: 0;
    }

    .intro {
      color: #536985;
      line-height: 1.5;
    }

    form {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    label {
      display: block;
      font-weight: bold;
      font-size: 14px;
    }

    input, select {
      display: block;
      width: 100%;
      margin-top: 7px;
      padding: 12px;
      border: 1px solid #cbd7e6;
      border-radius: 8px;
      font: inherit;
      background: white;
    }

    button {
      padding: 13px 18px;
      border: 0;
      border-radius: 8px;
      background: #1769d2;
      color: white;
      font: inherit;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .full {
      grid-column: 1 / -1;
    }

    #message {
      margin-top: 16px;
      overflow-wrap: anywhere;
    }

    #results {
      display: grid;
      gap: 14px;
      margin-top: 18px;
    }

    .card {
      padding: 18px;
      background: #f8fbff;
      border: 1px solid #dce7f5;
      border-radius: 10px;
    }

    .card h3 {
      margin-top: 0;
    }

    .card p {
      line-height: 1.5;
      color: #536985;
    }

    .card a {
      color: #1769d2;
      font-weight: bold;
    }

    @media (max-width: 600px) {
      form {
        grid-template-columns: 1fr;
      }

      .full {
        grid-column: auto;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>GovGuide</h1>
    <nav>
      <a href="./index.html">Home</a>
      <a href="./profile.html">Profile</a>
      <a href="./admin.html">Admin</a>
    </nav>
  </header>

  <main>
    <section class="panel">
      <h2>My Profile</h2>

      <p class="intro">
        Enter your details to find government jobs, exams,
        schemes and scholarships matching your profile.
      </p>

      <form id="profileForm">
        <label>Name
          <input name="name" required maxlength="100"
                 placeholder="Your name">
        </label>

        <label>Age
          <input name="age" type="number" min="1" max="120"
                 required>
        </label>

        <label>Qualification
          <select name="qualification" required>
            <option value="">Select qualification</option>
            <option>10th</option>
            <option>Intermediate</option>
            <option>Diploma</option>
            <option>B.Tech</option>
            <option>Degree</option>
            <option>M.Tech</option>
            <option>Post Graduation</option>
          </select>
        </label>

        <label>Branch / Subject
          <input name="branch"
                 placeholder="e.g. Computer Science">
        </label>

        <label>Percentage
          <input name="percentage" type="number"
                 min="0" max="100" step="0.01" required>
        </label>

        <label>State
          <select name="state" required>
            <option value="">Select state</option>
            <option>Andhra Pradesh</option>
            <option>Telangana</option>
            <option>Karnataka</option>
            <option>Tamil Nadu</option>
            <option>Other</option>
          </select>
        </label>

        <label>Category
          <select name="category" required>
            <option value="">Select category</option>
            <option>General</option>
            <option>OBC</option>
            <option>SC</option>
            <option>ST</option>
            <option>Other</option>
          </select>
        </label>

        <div class="full">
          <button id="submitButton" type="submit">
            Find Matching Opportunities
          </button>
        </div>
      </form>

      <p id="message" role="status" aria-live="polite"></p>
    </section>

    <section class="panel">
      <h2>Potential Matches</h2>
      <p class="intro">
        Matching opportunities will appear here.
      </p>
      <div id="results"></div>
    </section>
  </main>

  <script>
    const API_URL = "https://govguide-1h64.onrender.com";

    const form = document.getElementById("profileForm");
    const message = document.getElementById("message");
    const results = document.getElementById("results");
    const submitButton = document.getElementById("submitButton");

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      message.textContent = "Saving your profile...";
      results.replaceChildren();
      submitButton.disabled = true;

      const formData = Object.fromEntries(
        new FormData(form).entries()
      );

      const data = {
        name: formData.name.trim(),
        age: Number(formData.age),
        qualification: formData.qualification,
        branch: formData.branch.trim(),
        percentage: Number(formData.percentage),
        state: formData.state,
        category: formData.category
      };

      try {
        const saveResponse = await fetch(API_URL + "/profile", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(data)
        });

        const saveResult = await saveResponse.json();

        if (!saveResponse.ok) {
          throw new Error(
            saveResult.message || "Could not save profile."
          );
        }

        message.textContent =
          "Profile saved! Looking for matching opportunities...";

        const matchResponse = await fetch(API_URL + "/match", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            age: data.age,
            qualification: data.qualification,
            state: data.state
          })
        });

        const matchResult = await matchResponse.json();

        if (!matchResponse.ok) {
          throw new Error(
            "Profile saved, but matching failed: " +
            (matchResult.message || matchResponse.status)
          );
        }

        const matches = Array.isArray(matchResult)
          ? matchResult
          : matchResult.opportunities || matchResult.matches || [];

        if (matches.length === 0) {
          results.textContent =
            "Your profile was saved, but no matching opportunities were found.";
        } else {
          matches.forEach(function(item) {
            const card = document.createElement("article");
            card.className = "card";

            const title = document.createElement("h3");
            title.textContent = item.title || "Opportunity";

            const details = document.createElement("p");
            details.textContent =
              (item.type || "") + " | " +
              (item.organization || "") +
              " | Qualification: " +
              (item.qualification || "Not specified");

            const description = document.createElement("p");
            description.textContent =
              item.description || "No description available.";

            card.append(title, details, description);

            const officialLink = item.officialLink || item.officialURL;

            if (officialLink) {
              try {
                const parsedURL = new URL(officialLink);

                if (parsedURL.protocol === "https:" ||
                    parsedURL.protocol === "http:") {
                  const link = document.createElement("a");
                  link.href = parsedURL.href;
                  link.target = "_blank";
                  link.rel = "noopener noreferrer";
                  link.textContent = "Official website";
                  card.append(link);
                }
              } catch (error) {
                // Ignore invalid website links.
              }
            }

            results.append(card);
          });
        }

        message.textContent = "Profile saved successfully!";
        form.reset();

      } catch (error) {
        message.textContent =
          "Error: " + error.message +
          ". Check the backend API and try again.";
      } finally {
        submitButton.disabled = false;
      }
    });
  </script>
</body>
</html>
