```html
<script>
  const API_URL = "https://YOUR_BACKEND_URL";

  const form = document.getElementById("profileForm");
  const message = document.getElementById("message");
  const results = document.getElementById("results");

  form.addEventListener("submit", async function(event) {
    event.preventDefault();

    message.textContent = "Saving your profile...";
    results.replaceChildren();

    const formData = Object.fromEntries(
      new FormData(form).entries()
    );

    const data = {
      name: formData.name.trim(),
      age: Number(formData.age),
      qualification: formData.qualification,
      branch: formData.branch.trim(),
      percentage: Number(formData.percentage),
      state: formData.state,
      category: formData.category
    };

    try {
      const saveResponse = await fetch(API_URL + "/profile", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(data)
      });

      const saveResult = await saveResponse.json();

      if (!saveResponse.ok) {
        throw new Error(saveResult.message || "Could not save profile.");
      }

      message.textContent = "Profile saved successfully! Finding matches...";

      const matchResponse = await fetch(API_URL + "/match", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          age: data.age,
          qualification: data.qualification,
          state: data.state
        })
      });

      const matches = await matchResponse.json();

      if (!matchResponse.ok) {
        throw new Error(matches.message || "Profile saved, but matching failed.");
      }

      results.replaceChildren();

      if (matches.length === 0) {
        results.textContent = "Your profile was saved, but no matching opportunities were found yet.";
      } else {
        matches.forEach(function(item) {
          const card = document.createElement("article");
          card.className = "card";

          const title = document.createElement("h3");
          title.textContent = item.title;

          const details = document.createElement("p");
          details.textContent =
            item.type + " | " + item.organization +
            " | Qualification: " + item.qualification;

          const description = document.createElement("p");
          description.textContent = item.description;

          card.append(title, details, description);

          if (item.officialLink) {
            const link = document.createElement("a");
            link.href = item.officialLink;
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.textContent = "Official website";
            card.append(link);
          }

          results.append(card);
        });
      }

      message.textContent = "Profile saved successfully!";
      form.reset();

    } catch (error) {
      message.textContent =
        "Error: " + error.message +
        " Please check the backend URL and try again.";
    }
  });
</script>
